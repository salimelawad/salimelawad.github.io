# Tectonic is a single self-contained LaTeX binary with prebuilt releases for
# macOS, Linux/WSL, and Windows, so `mise run pdf` works the same on all three.
# The tag is spelled "tectonic@0.17.0" because upstream prefixes its git tags.

[tools]
"github:tectonic-typesetting/tectonic" = "tectonic@0.17.0"

[tasks.pdf]
description = "Render resume.tex to resume.pdf"
# Pin the PDF's internal creation timestamp so an unchanged resume.tex always
# renders to a byte-identical resume.pdf. Without this, every render produces a
# new binary and shows up as a spurious git diff.
env = { SOURCE_DATE_EPOCH = "1786752000" }
run = "tectonic resume.tex"
